[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "topic-modeling-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditing against Python syntax"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
topic-modeling-claim-audit = "topic_modeling_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["topic_modeling_claim_audit*"]
